server {
    # Puerto HTTP alternativo (co-ubicado en IP única del lab).
    listen 8080;
    server_name _;
    server_tokens off;
    add_header Server "Boa/0.94.13" always;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoints sin auth deliberadamente
    location /config.cfg {
        add_header Content-Type text/plain;
    }

    location /api/v1/system {
        add_header Content-Type application/json;
        return 200 '{"model":"VulnRouter-X1000","firmware":"1.2.3","admin_pass":"admin123"}';
    }

    location /cgi-bin/ {
        return 200 "CGI endpoint stub";
    }

    # Panel admin REAL protegido con HTTP Basic. La credencial (admin/Sup3rS3cret!2024)
    # se filtra en /backup.html y /config.js (CVE-2021-33558) → cadena completa:
    # info-disclosure → acceso autenticado. El resto del sitio sigue público.
    location /admin/ {
        auth_basic "VulnRouter Admin";
        auth_basic_user_file /etc/nginx/vulnhttp.htpasswd;
    }
}
